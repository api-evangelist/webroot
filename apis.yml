aid: webroot
name: Webroot
description: >-
  Webroot is a cybersecurity company, now part of OpenText Cybersecurity, that
  provides cloud-based endpoint protection, DNS protection, security awareness
  training, and the BrightCloud threat intelligence services. Its developer
  surface is the Webroot Unity API — a REST/JSON platform secured with OAuth2
  that lets partners and administrators manage product licenses and orders,
  query order information, and request endpoint status across the Webroot Global
  Site Manager (GSM) console. Webroot business and BrightCloud product pages now
  redirect into OpenText Cybersecurity, and the Unity API documentation remains
  actively maintained.
